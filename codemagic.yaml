# =============================================================================
# AI CAGE Mobile — Codemagic CI/CD Build Configuration
# =============================================================================
workflows:
  android-apk:
    name: AI CAGE Android APK
    max_build_duration: 60
    environment:
      node: 20.11.0
      java: 17

    scripts:
      - name: Enable pnpm via corepack
        script: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm --version

      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          pnpm install --no-frozen-lockfile

      - name: Build @ai-cage/presidio-lite
        script: |
          cd $CM_BUILD_DIR
          pnpm --filter "@ai-cage/presidio-lite" build

      - name: Build @ai-cage/core
        script: |
          cd $CM_BUILD_DIR
          pnpm --filter "@ai-cage/core" build

      - name: Run 202 tests
        script: |
          cd $CM_BUILD_DIR
          pnpm test

      - name: TypeScript check
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx tsc --noEmit

      - name: Expo prebuild
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx expo prebuild --platform android --clean

      - name: Restore custom Android files overwritten by expo prebuild
        script: |
          set -e
          cd $CM_BUILD_DIR

          # expo prebuild --clean regenerates android/ entirely.
          # Our Kotlin VPN source files and strings.xml are tracked in git.
          # We restore ONLY those — NOT app/build.gradle (expo's version is correct).
          git checkout HEAD -- \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/AiCageVpnService.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/AiEndpointMatcher.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/CageBridge.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/CageNativeModule.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/CageVpnModule.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/CageVpnPackage.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/LocalCertManager.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/LocalMitmProxy.kt \
            apps/mobile/android/app/src/main/res/values/strings.xml
          echo "Kotlin VPN files and strings.xml restored."

          # Patch app/build.gradle generated by expo to add:
          #   1. BouncyCastle — required by LocalCertManager (X.509 / MITM proxy)
          #   2. autolinking app-level (native_modules.gradle applyNativeModulesAppBuildGradle)
          # We append at the end of the file so the expo-generated content
          # (com.facebook.react plugin, BOM, rootProject.ext.* vars) stays intact.
          APP_BUILD="$CM_BUILD_DIR/apps/mobile/android/app/build.gradle"
          MOBILE="$CM_BUILD_DIR/apps/mobile"

          RNC_PKG=$(cd "$MOBILE" && node -e "
            try {
              var rn = require.resolve('react-native/package.json');
              process.stdout.write(require('path').dirname(
                require.resolve('@react-native-community/cli-platform-android/package.json',
                  { paths: [rn] })
              ));
            } catch(e) {
              process.stdout.write(require('path').dirname(
                require.resolve('@react-native-community/cli-platform-android/package.json')
              ));
            }
          ")

          echo "Patching $APP_BUILD"
          echo "  cli-platform-android => $RNC_PKG"

          # Use Node.js to patch app/build.gradle — avoids sed macOS/Linux incompatibility.
          # (macOS BSD sed requires 'sed -i ""' while GNU sed uses 'sed -i' — both fail portably)
          # Node: remove any existing BouncyCastle lines, then append our additions.
          node -e "
            var fs = require('fs');
            var content = fs.readFileSync('$APP_BUILD', 'utf8');
            // Remove any previously-appended BouncyCastle block (idempotent)
            content = content.split('\n').filter(function(l) {
              return l.indexOf('bouncycastle') === -1 &&
                     l.indexOf('AI CAGE') === -1 &&
                     l.indexOf('applyNativeModulesAppBuildGradle') === -1;
            }).join('\n');
            // Append BouncyCastle + app-level autolinking at end of file
            var addition = [
              '',
              '// AI CAGE -- BouncyCastle for on-device MITM proxy CA (LocalCertManager)',
              'dependencies {',
              '    implementation \"org.bouncycastle:bcpkix-jdk18on:1.78.1\"',
              '    implementation \"org.bouncycastle:bcprov-jdk18on:1.78.1\"',
              '}',
              '',
              '// AI CAGE -- app-level autolinking',
              'apply from: new File(\"$RNC_PKG\", \"native_modules.gradle\"); applyNativeModulesAppBuildGradle(project)',
              '',
            ].join('\n');
            fs.writeFileSync('$APP_BUILD', content + addition);
            console.log('OK: app/build.gradle patched');
          "

          echo "=== app/build.gradle (last 20 lines) ==="
          tail -20 "$APP_BUILD"

      - name: Fix settings.gradle — patch @react-native/gradle-plugin path
        script: |
          set -e
          SETTINGS="$CM_BUILD_DIR/apps/mobile/android/settings.gradle"
          MOBILE="$CM_BUILD_DIR/apps/mobile"

          echo "=== settings.gradle BEFORE ==="
          cat "$SETTINGS"
          echo "=============================="

          # Resolve @react-native/gradle-plugin — the directory that contains
          # build.gradle.kts and settings.gradle.kts for the Gradle composite build.
          # We try CM_BUILD_DIR first (after .npmrc hoist fix), then MOBILE as fallback.
          PLUGIN=""
          for SEARCH_DIR in "$CM_BUILD_DIR" "$MOBILE"; do
            CANDIDATE=$(cd "$SEARCH_DIR" && node -e "
              try {
                process.stdout.write(
                  require('path').dirname(
                    require.resolve('@react-native/gradle-plugin/package.json')
                  )
                );
              } catch(e) {
                try {
                  var rn = require.resolve('react-native/package.json');
                  process.stdout.write(
                    require('path').dirname(
                      require.resolve('@react-native/gradle-plugin/package.json',
                        { paths: [rn] })
                    )
                  );
                } catch(e2) { process.stdout.write(''); }
              }
            " 2>/dev/null || true)
            if [ -n "$CANDIDATE" ] && [ -d "$CANDIDATE" ]; then
              PLUGIN="$CANDIDATE"
              echo "  @react-native/gradle-plugin => $PLUGIN"
              break
            fi
          done

          if [ -z "$PLUGIN" ]; then
            echo "ERROR: cannot locate @react-native/gradle-plugin"
            exit 1
          fi

          # Resolve @react-native-community/cli-platform-android for native_modules.gradle
          RNC_PKG=$(cd "$MOBILE" && node -e "
            try {
              var rn = require.resolve('react-native/package.json');
              process.stdout.write(require('path').dirname(
                require.resolve('@react-native-community/cli-platform-android/package.json',
                  { paths: [rn] })
              ));
            } catch(e) {
              process.stdout.write(require('path').dirname(
                require.resolve('@react-native-community/cli-platform-android/package.json')
              ));
            }
          ")
          echo "  cli-platform-android  => $RNC_PKG"

          # Write the settings.gradle following the OFFICIAL react-native 0.74 template.
          #
          # IMPORTANT: We do NOT use pluginManagement + plugins{id("com.facebook.react.settings")}
          # because that plugin does NOT exist in @react-native/gradle-plugin@0.74.x.
          # It was introduced in RN 0.75+. Using it on 0.74 causes:
          #   "Plugin [id: 'com.facebook.react.settings'] was not found"
          #
          # The correct template for RN 0.74.3 is the 4-line version from
          # react-native/template/android/settings.gradle — simple, no plugin block.
          printf "rootProject.name = 'AI CAGE'\n" > "$SETTINGS"
          printf 'apply from: new File("%s", "native_modules.gradle"); applyNativeModulesSettingsGradle(settings)\n' "$RNC_PKG" >> "$SETTINGS"
          printf "include ':app'\n" >> "$SETTINGS"
          printf 'includeBuild("%s")\n' "$PLUGIN" >> "$SETTINGS"

          echo "=== settings.gradle AFTER ==="
          cat "$SETTINGS"
          echo "=============================="

      - name: Build Android debug APK
        script: |
          cd $CM_BUILD_DIR/apps/mobile/android
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - aicage.support@gmail.com
        notify:
          success: true
          failure: true
