# =============================================================================
# AI CAGE Mobile — Codemagic CI/CD Build Configuration
# =============================================================================
#
# FIX BUILD 22 — Root cause analysis:
#
#   expo prebuild generates settings.gradle with dynamic node --print calls:
#     ["node","--print","require.resolve('@react-native/gradle-plugin/package.json')"]
#     .execute(null, rootDir)
#
#   In a pnpm monorepo, @react-native/gradle-plugin lives in the pnpm virtual
#   store (.pnpm/) which is NOT in the Node.js module resolution path from
#   android/ at Gradle config time. This produces "null" or fails.
#
#   Additionally, Expo 51 + RN 0.74.3 generates a react-settings-plugin/
#   companion build inside android/. This directory must exist on disk when
#   Gradle parses settings.gradle (includeBuild("react-settings-plugin")).
#
# SOLUTION — Two-pronged fix:
#
#   1. Export NODE_PATH before expo prebuild AND before Gradle.
#      NODE_PATH is set to the pnpm virtual store node_modules directory
#      containing @react-native/gradle-plugin as a sibling of react-native.
#      This makes require.resolve() succeed from any working directory,
#      including android/ at Gradle config time.
#
#   2. All generated android/ files (including react-settings-plugin/) are
#      committed to git. The "Restore Kotlin VPN sources" step uses
#      git checkout HEAD to restore only our custom files after prebuild --clean.
#      react-settings-plugin/ is part of the committed android/ tree.
#      (see .gitignore — only build artifacts are excluded)
#
# =============================================================================
workflows:
  android-apk:
    name: AI CAGE Android APK
    max_build_duration: 60
    
    # Prevent duplicate builds — trigger only on master branch push
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
          source: true
      cancel_previous_builds: true
    
    environment:
      node: 20.11.0
      java: 17

    scripts:
      - name: Enable pnpm via corepack
        script: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm --version

      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          pnpm install --no-frozen-lockfile

      - name: Build @ai-cage/presidio-lite
        script: |
          cd $CM_BUILD_DIR
          pnpm --filter "@ai-cage/presidio-lite" build

      - name: Build @ai-cage/core
        script: |
          cd $CM_BUILD_DIR
          pnpm --filter "@ai-cage/core" build

      - name: Run 202 tests
        script: |
          cd $CM_BUILD_DIR
          pnpm test

      - name: TypeScript check
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx tsc --noEmit

      - name: Set NODE_PATH for pnpm monorepo resolution
        script: |
          set -e
          MOBILE="$CM_BUILD_DIR/apps/mobile"

          # Resolve the pnpm virtual store sibling directory for @react-native/*.
          # react-native is a junction in apps/mobile/node_modules pointing into
          # the pnpm store. Its parent directory is the store node_modules folder
          # that also contains @react-native/gradle-plugin as a sibling.
          #
          # node --print require.resolve('react-native/package.json') works because
          # react-native is a junction in apps/mobile/node_modules/ (always present).
          # We take the grandparent (strip /react-native from the path) to get the
          # pnpm store node_modules/ that contains @react-native/*.

          RN_PKG_JSON=$(cd "$MOBILE" && node --print "require.resolve('react-native/package.json')")
          # RN_PKG_JSON = .../node_modules/.pnpm/react-native@.../node_modules/react-native/package.json
          # Strip /react-native/package.json  → .../node_modules/.pnpm/react-native@.../node_modules
          RN_PNPM_NM=$(dirname "$(dirname "$RN_PKG_JSON")")

          echo "[NODE_PATH] react-native pnpm store node_modules: $RN_PNPM_NM"

          # Verify @react-native/gradle-plugin exists as sibling
          GRADLE_PLUGIN_CHECK="$RN_PNPM_NM/@react-native/gradle-plugin"
          if [ ! -d "$GRADLE_PLUGIN_CHECK" ]; then
            echo "[NODE_PATH] WARNING: gradle-plugin not found as sibling, trying dedicated pnpm entry..."
            # Fallback: find the dedicated pnpm store entry for @react-native/gradle-plugin
            GRADLE_ENTRY=$(ls "$CM_BUILD_DIR/node_modules/.pnpm/" | grep "@react-native+gradle-plugin" | head -1)
            RN_PNPM_NM="$CM_BUILD_DIR/node_modules/.pnpm/$GRADLE_ENTRY/node_modules"
            echo "[NODE_PATH] fallback store: $RN_PNPM_NM"
          fi

          # Export NODE_PATH — this makes require.resolve('@react-native/gradle-plugin')
          # succeed from ANY working directory, including android/ at Gradle config time.
          # The variable persists for all subsequent steps in this Codemagic build.
          echo "NODE_PATH=$RN_PNPM_NM" >> $CM_ENV

          echo "[NODE_PATH] exported: $RN_PNPM_NM"

          # Immediate smoke test from apps/mobile
          RESOLVED=$(cd "$MOBILE" && NODE_PATH="$RN_PNPM_NM" node --print \
            "require.resolve('@react-native/gradle-plugin/package.json')")
          echo "[NODE_PATH] smoke test: $RESOLVED"
          if echo "$RESOLVED" | grep -q "null\|Error\|Cannot"; then
            echo "[NODE_PATH] FAIL: could not resolve @react-native/gradle-plugin"
            exit 1
          fi
          echo "[NODE_PATH] OK — gradle-plugin resolvable"

      - name: Expo prebuild
        script: |
          set -e
          cd $CM_BUILD_DIR/apps/mobile

          # NODE_PATH is now set from the previous step (via $CM_ENV).
          # expo prebuild internally calls:
          #   node --print "require.resolve('@react-native/gradle-plugin/package.json')"
          # With NODE_PATH set, this resolves correctly and settings.gradle is
          # generated with real paths instead of "null".
          echo "[prebuild] NODE_PATH=$NODE_PATH"
          npx expo prebuild --platform android --clean

          echo "[prebuild] settings.gradle generated:"
          cat android/settings.gradle

      - name: Restore Kotlin VPN sources and patch Android build files
        script: |
          set -e
          cd $CM_BUILD_DIR

          # ── Step 1: restore Kotlin VPN sources and strings.xml ──────────────
          # expo prebuild --clean regenerates the entire android/ directory and
          # overwrites our native VPN module source files. These are tracked in
          # git and must be restored before Gradle runs.
          # NOTE: app/build.gradle is NOT restored — we let expo generate it
          # (it has the com.facebook.react plugin + BOM we need) and patch it.
          git checkout HEAD -- \
            apps/mobile/android/gradle.properties \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/AiCageVpnService.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/AiEndpointMatcher.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/CageBridge.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/CageNativeModule.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/CageVpnModule.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/CageVpnPackage.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/LocalCertManager.kt \
            apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/LocalMitmProxy.kt \
            apps/mobile/android/app/src/main/res/values/strings.xml
          echo "[patch] gradle.properties, Kotlin VPN sources and strings.xml restored."

          # ── Safety check: verify critical Kotlin files are correct ──────────
          echo "[safety] Verifying Kotlin compilation fixes..."
          
          # Check 1: LocalMitmProxy.kt must have 2-parameter isAiEndpoint calls
          LOCAL_PROXY="$CM_BUILD_DIR/apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/LocalMitmProxy.kt"
          if ! grep -q 'isAiEndpoint(host, "")' "$LOCAL_PROXY"; then
            echo "[safety] ERROR: LocalMitmProxy.kt missing isAiEndpoint(host, \"\") fix"
            exit 1
          fi
          if ! grep -q 'isAiEndpoint(url.host, url.path)' "$LOCAL_PROXY"; then
            echo "[safety] ERROR: LocalMitmProxy.kt missing isAiEndpoint(url.host, url.path) fix"
            exit 1
          fi
          
          # Check 2: AiEndpointMatcher.kt must end with closing brace
          ENDPOINT_MATCHER="$CM_BUILD_DIR/apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/AiEndpointMatcher.kt"
          if ! tail -1 "$ENDPOINT_MATCHER" | grep -q '^}$'; then
            echo "[safety] ERROR: AiEndpointMatcher.kt missing closing brace"
            exit 1
          fi
          
          # Check 3: CageNativeModule.kt must have RN 0.74 fallback
          CAGE_MODULE="$CM_BUILD_DIR/apps/mobile/android/app/src/main/kotlin/io/aicage/mobile/vpn/CageNativeModule.kt"
          if ! grep -q 'RN 0.74: evaluateJavaScript unavailable' "$CAGE_MODULE"; then
            echo "[safety] ERROR: CageNativeModule.kt missing RN 0.74 evaluateJavaScript fallback"
            exit 1
          fi
          
          echo "[safety] All Kotlin compilation fixes verified ✓"

          # ── Step 2: resolve package paths from apps/mobile ──────────────────
          # NODE_PATH is set — require.resolve works for all packages.
          MOBILE="$CM_BUILD_DIR/apps/mobile"

          PLUGIN=$(cd "$MOBILE" && node -e "
            var p = require.resolve('@react-native/gradle-plugin/package.json');
            process.stdout.write(require('path').dirname(p));
          ")

          RN_PKG=$(cd "$MOBILE" && node -e "
            process.stdout.write(require('path').dirname(require.resolve('react-native/package.json')));
          ")

          RNC_PKG=$(cd "$MOBILE" && node -e "
            try {
              var rn = require.resolve('react-native/package.json');
              var p = require.resolve('@react-native-community/cli-platform-android/package.json', {paths:[require('path').dirname(rn)]});
              process.stdout.write(require('path').dirname(p));
            } catch(e) {
              var p2 = require.resolve('@react-native-community/cli-platform-android/package.json');
              process.stdout.write(require('path').dirname(p2));
            }
          ")

          EXPO_PKG=$(cd "$MOBILE" && node -e "
            process.stdout.write(require('path').dirname(require.resolve('expo/package.json')));
          ")

          echo "[patch] PLUGIN  = $PLUGIN"
          echo "[patch] RN_PKG  = $RN_PKG"
          echo "[patch] RNC_PKG = $RNC_PKG"
          echo "[patch] EXPO    = $EXPO_PKG"

          # ── Step 3: run patch-android.mjs ───────────────────────────────────
          SETTINGS="$CM_BUILD_DIR/apps/mobile/android/settings.gradle"
          APP_BUILD="$CM_BUILD_DIR/apps/mobile/android/app/build.gradle"
          PATCH_SCRIPT="$CM_BUILD_DIR/apps/mobile/scripts/patch-android.mjs"

          echo "=== settings.gradle BEFORE patch ==="
          cat "$SETTINGS"
          echo "====================================="

          node "$PATCH_SCRIPT" \
            "$SETTINGS" \
            "$APP_BUILD" \
            "$PLUGIN" \
            "$RN_PKG" \
            "$RNC_PKG" \
            "$EXPO_PKG"

          echo "=== settings.gradle AFTER patch ==="
          cat "$SETTINGS"
          echo "===================================="
          echo "=== app/build.gradle (last 15 lines) ==="
          tail -15 "$APP_BUILD"

      - name: Build Android debug APK
        script: |
          cd $CM_BUILD_DIR/apps/mobile/android
          echo "[gradle] NODE_PATH=$NODE_PATH"
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - aicage.support@gmail.com
        notify:
          success: true
          failure: true
