# =============================================================================
# AI CAGE Mobile — Codemagic CI/CD Build Configuration
# =============================================================================
#
# USAGE:
#   1. Connect your GitHub repo (smartsniper31/ai-cage) to Codemagic
#   2. Codemagic reads this file automatically
#   3. Click "Start new build" → select workflow "android-apk"
#   4. The APK is available in Codemagic artifacts after ~10 minutes
#
# WORKFLOWS:
#   android-apk     → Debug APK for direct install (free tier)
#   android-release → Signed release APK for distribution
#
# NOTES:
#   - Project uses pnpm workspaces (not yarn or npm)
#   - packageManager field in package.json declares pnpm@9.0.0
#   - corepack is used to activate pnpm on Codemagic machines
# =============================================================================

workflows:

  # ── Workflow 1: Debug APK (free, no signing required) ─────────────────────
  android-apk:
    name: AI CAGE Android APK
    max_build_duration: 60
    environment:
      node: 20.11.0
      java: 17

    scripts:
      # ── Step 1: Activate pnpm via corepack ────────────────────────────────
      - name: Enable pnpm via corepack
        script: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm --version

      # ── Step 2: Install all workspace dependencies ────────────────────────
      # public-hoist-pattern in .npmrc hoists React Native + Expo to root
      # node_modules so Gradle can find them during prebuild
      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          pnpm install --no-frozen-lockfile

      # ── Step 3: Build workspace packages ─────────────────────────────────
      - name: Build @ai-cage/presidio-lite
        script: |
          cd $CM_BUILD_DIR
          pnpm --filter "@ai-cage/presidio-lite" build

      - name: Build @ai-cage/core
        script: |
          cd $CM_BUILD_DIR
          pnpm --filter "@ai-cage/core" build

      # ── Step 4: Run 202 tests ─────────────────────────────────────────────
      - name: Run 202 tests (zero regression policy)
        script: |
          cd $CM_BUILD_DIR
          pnpm test

      # ── Step 5: TypeScript check ──────────────────────────────────────────
      - name: TypeScript type-check apps/mobile
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx tsc --noEmit

      # ── Step 7: Expo prebuild ─────────────────────────────────────────────
      - name: Expo prebuild
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx expo prebuild --platform android --clean

      # ── Step 8: Patch settings.gradle for pnpm monorepo ─────────────────
      # expo prebuild generates settings.gradle with a node --print command
      # that resolves react-native paths. In pnpm monorepo, this returns "null"
      # because node_modules are at workspace root, not in apps/mobile.
      # We patch the file to use an explicit path that works in both envs.
      - name: Patch settings.gradle for pnpm monorepo
        script: |
          SETTINGS="$CM_BUILD_DIR/apps/mobile/android/settings.gradle"
          echo "=== settings.gradle BEFORE patch ==="
          cat "$SETTINGS"
          echo "==="

          # Find react-native location
          RN_PATH=$(node --print "require.resolve('react-native/package.json')" \
            --experimental-vm-modules 2>/dev/null || \
            node -e "console.log(require.resolve('react-native/package.json'))" 2>/dev/null || \
            echo "")
          RN_PATH="${RN_PATH%/package.json}"
          echo "React Native found at: $RN_PATH"

          if [ -z "$RN_PATH" ] || [ "$RN_PATH" = "null" ]; then
            # Search in workspace root node_modules
            RN_PATH="$CM_BUILD_DIR/node_modules/react-native"
          fi

          RN_GRADLE_PLUGIN="$CM_BUILD_DIR/node_modules/@react-native/gradle-plugin"

          # Replace the dynamic node --print resolve with static paths
          sed -i.bak \
            "s|new File(\[\"node\", \"--print\", \"require.resolve('@react-native/gradle-plugin.*\").*\.execute.*|new File(\"$RN_GRADLE_PLUGIN\")|g" \
            "$SETTINGS"

          sed -i.bak2 \
            "s|new File(\[\"node\", \"--print\", \"require.resolve('react-native/.*\").*\.execute.*|new File(\"$RN_PATH\")|g" \
            "$SETTINGS"

          echo "=== settings.gradle AFTER patch ==="
          cat "$SETTINGS"
          echo "==="

      # ── Step 9: Build debug APK ───────────────────────────────────────────
      - name: Build Android debug APK
        script: |
          cd $CM_BUILD_DIR/apps/mobile/android
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - aicage.support@gmail.com
        notify:
          success: true
          failure: true

  # ── Workflow 2: Release APK (signed) ──────────────────────────────────────
  android-release:
    name: AI CAGE Android Release APK
    max_build_duration: 60
    environment:
      node: 20.11.0
      java: 17
      vars:
        PACKAGE_NAME: "io.aicage.mobile"

    scripts:
      - name: Enable pnpm via corepack
        script: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm --version

      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        script: |
          cd $CM_BUILD_DIR
          pnpm --filter "@ai-cage/presidio-lite" build
          pnpm --filter "@ai-cage/core" build

      - name: Run 202 tests
        script: |
          cd $CM_BUILD_DIR
          pnpm test

      - name: TypeScript check
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx tsc --noEmit

      - name: Expo prebuild
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx expo prebuild --platform android --clean

      - name: Build release APK
        script: |
          cd $CM_BUILD_DIR/apps/mobile/android
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        script: |
          if [ -n "$CM_KEYSTORE_PATH" ]; then
            cd $CM_BUILD_DIR/apps/mobile/android
            jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore "$CM_KEYSTORE_PATH" \
              -storepass "$CM_KEYSTORE_PASSWORD" \
              -keypass "$CM_KEY_PASSWORD" \
              app/build/outputs/apk/release/app-release-unsigned.apk \
              "$CM_KEY_ALIAS"
          else
            echo "No keystore — skipping signing"
          fi

    artifacts:
      - apps/mobile/android/app/build/outputs/apk/release/*.apk
      - apps/mobile/android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - aicage.support@gmail.com
        notify:
          success: true
          failure: true
