# =============================================================================
# AI CAGE Mobile — Codemagic CI/CD Build Configuration
# =============================================================================
workflows:
  android-apk:
    name: AI CAGE Android APK
    max_build_duration: 60
    environment:
      node: 20.11.0
      java: 17

    scripts:
      - name: Enable pnpm via corepack
        script: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm --version

      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          pnpm install --no-frozen-lockfile

      - name: Build @ai-cage/presidio-lite
        script: |
          cd $CM_BUILD_DIR
          pnpm --filter "@ai-cage/presidio-lite" build

      - name: Build @ai-cage/core
        script: |
          cd $CM_BUILD_DIR
          pnpm --filter "@ai-cage/core" build

      - name: Run 202 tests
        script: |
          cd $CM_BUILD_DIR
          pnpm test

      - name: TypeScript check
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx tsc --noEmit

      - name: Expo prebuild
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx expo prebuild --platform android --clean

      - name: Fix settings.gradle — patch @react-native/gradle-plugin path
        script: |
          set -e
          SETTINGS="$CM_BUILD_DIR/apps/mobile/android/settings.gradle"

          echo "=== settings.gradle BEFORE patch ==="
          cat "$SETTINGS"

          # Resolve the real path of @react-native/gradle-plugin using node
          # from the workspace root — works with pnpm virtual store because
          # node resolves through .pnpm symlinks from CM_BUILD_DIR correctly.
          PLUGIN=$(cd "$CM_BUILD_DIR" && node -e "const p=require.resolve('@react-native/gradle-plugin/package.json');const path=require('path');process.stdout.write(path.dirname(p));")

          echo "Resolved plugin path: $PLUGIN"

          if [ -z "$PLUGIN" ] || [ ! -d "$PLUGIN" ]; then
            echo "ERROR: could not resolve @react-native/gradle-plugin — aborting"
            exit 1
          fi

          # Rewrite settings.gradle with a clean, static includeBuild.
          # The expo-generated file uses a dynamic node --print shell-exec that
          # returns 'null' in a pnpm monorepo (hoisted to .pnpm virtual store).
          printf 'pluginManagement { repositories { google(); mavenCentral() } }\n' > "$SETTINGS"
          printf 'dependencyResolutionManagement { repositories { google(); mavenCentral() } }\n' >> "$SETTINGS"
          printf "rootProject.name = 'ai-cage-mobile'\n" >> "$SETTINGS"
          printf 'apply from: file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesSettingsGradle(settings)\n' >> "$SETTINGS"
          printf "include ':app'\n" >> "$SETTINGS"
          printf 'includeBuild("%s")\n' "$PLUGIN" >> "$SETTINGS"

          echo "=== settings.gradle AFTER patch ==="
          cat "$SETTINGS"

      - name: Build Android debug APK
        script: |
          cd $CM_BUILD_DIR/apps/mobile/android
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - aicage.support@gmail.com
        notify:
          success: true
          failure: true
