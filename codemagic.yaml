# =============================================================================
# AI CAGE Mobile — Codemagic CI/CD Build Configuration
# =============================================================================
workflows:
  android-apk:
    name: AI CAGE Android APK
    max_build_duration: 60
    environment:
      node: 20.11.0
      java: 17

    scripts:
      - name: Enable pnpm via corepack
        script: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm --version

      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          pnpm install --no-frozen-lockfile

      - name: Build @ai-cage/presidio-lite
        script: |
          cd $CM_BUILD_DIR
          pnpm --filter "@ai-cage/presidio-lite" build

      - name: Build @ai-cage/core
        script: |
          cd $CM_BUILD_DIR
          pnpm --filter "@ai-cage/core" build

      - name: Run 202 tests
        script: |
          cd $CM_BUILD_DIR
          pnpm test

      - name: TypeScript check
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx tsc --noEmit

      - name: Expo prebuild
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx expo prebuild --platform android --clean

      - name: Fix settings.gradle — patch @react-native/gradle-plugin path
        script: |
          set -e
          SETTINGS="$CM_BUILD_DIR/apps/mobile/android/settings.gradle"
          PLUGIN="$CM_BUILD_DIR/node_modules/@react-native/gradle-plugin"
          PATCH_SCRIPT="$CM_BUILD_DIR/apps/mobile/scripts/patch_settings.py"
          echo "=== Diagnostics ==="
          echo "CM_BUILD_DIR: $CM_BUILD_DIR"
          echo "settings.gradle exists: $(test -f "$SETTINGS" && echo YES || echo NO)"
          echo "plugin dir exists: $(test -d "$PLUGIN" && echo YES || echo NO)"
          echo "node_modules/@react-native contents:"
          ls "$CM_BUILD_DIR/node_modules/@react-native/" 2>/dev/null || echo "(dir missing)"
          echo "mobile node_modules/@react-native contents:"
          ls "$CM_BUILD_DIR/apps/mobile/node_modules/@react-native/" 2>/dev/null || echo "(dir missing)"
          echo "=== Running patch ==="
          python3 "$PATCH_SCRIPT" "$SETTINGS" "$PLUGIN" "ai-cage-mobile"

      - name: Build Android debug APK
        script: |
          cd $CM_BUILD_DIR/apps/mobile/android
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - aicage.support@gmail.com
        notify:
          success: true
          failure: true
