[package]
name = "ai-cage-desktop"
version = "0.1.0"
description = "AI CAGE Desktop — Enterprise AI Data Protection"
authors = ["AI CAGE Contributors"]
license = "MIT"
repository = "https://github.com/your-org/ai-cage"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "shell-open",
  "window-all",
  "dialog-all",
  "clipboard-all",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# by default Tauri runs in production mode
# when `tauri dev` is run it'll use the `custom-protocol` feature
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"   # smaller binary
codegen-units = 1 # better optimisation
lto = true
opt-level = "s"   # optimise for size
strip = true
