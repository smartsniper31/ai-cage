// AI CAGE Mobile — Android app build.gradle (Groovy DSL)
// Custom file tracked in git — restored after expo prebuild --clean
// Provides BouncyCastle for on-device MITM proxy + VPN native module deps.

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "io.aicage.mobile"
    compileSdk 34

    defaultConfig {
        applicationId "io.aicage.mobile"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.6.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        // BouncyCastle ships signed JARs — exclude duplicate META-INF entries
        exclude "META-INF/BCKEY.SF"
        exclude "META-INF/BCKEY.DSA"
        exclude "META-INF/BC2048KE.SF"
        exclude "META-INF/BC2048KE.DSA"
    }
}

dependencies {
    // React Native — version managed by the RN Gradle plugin BOM
    implementation "com.facebook.react:react-android"
    implementation "com.facebook.react:hermes-android"

    // BouncyCastle — required by LocalCertManager for X.509 cert generation
    // Used ONLY for on-device MITM proxy CA; no network calls, no key export
    implementation "org.bouncycastle:bcpkix-jdk18on:1.78.1"
    implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"
}
